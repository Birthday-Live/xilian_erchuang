<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>昔涟 · 二创集</title>
    <style>
        /* ==========================================================
           昔涟 · 二创集  v4 —— Google / Material Design 风格
           白底 + Google 蓝主色 + Roboto/Noto Sans SC + 卡片层级阴影
           Google 四色标题 + Tabs 选项卡 + :root 变量统一控色
           ========================================================== */

        :root {
            /* Google 品牌色 */
            --blue: #1a73e8;
            --blue-dark: #1967d2;
            --blue-tint: #e8f0fe;
            --red: #ea4335;
            --green: #34a853;
            --yellow: #f9ab00;

            /* 表面与文字 */
            --bg: #fff;
            --surface: #fff;
            --surface-2: #f8f9fa;
            --text: #202124;
            --text-2: #5f6368;
            --text-3: #80868b;
            --divider: #dadce0;
            --divider-2: #e8eaed;
            --hover: rgba(60, 64, 67, .08);

            --radius: 12px;
            /* Material 标准两级阴影 */
            --shadow-1: 0 1px 2px rgba(60, 64, 67, .3), 0 1px 3px 1px rgba(60, 64, 67, .15);
            --shadow-2: 0 1px 3px rgba(60, 64, 67, .3), 0 4px 8px 3px rgba(60, 64, 67, .15);
            --ease: cubic-bezier(.4, 0, .2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; }
        :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }

        body {
            min-height: 100vh;
            padding: 24px 16px 72px;
            background: var(--bg);
            font-family: 'Google Sans', Roboto, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        body.no-scroll { overflow: hidden; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--divider); border: 3px solid var(--bg); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

        /* ===== 通用图标线稿 ===== */
        .chip svg, .corner-hint svg, .v-btn svg, .v-act svg, .appeal svg, .poster-fallback svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== 顶部（Google 四色 Logo 感） ===== */
        .site-header { text-align: center; padding: 10px 0 4px; user-select: none; pointer-events: none; }
        .site-header h1 {
            display: inline-block;
            position: relative;
            font-size: 40px;
            font-weight: 400;
            letter-spacing: 8px;
            padding-right: 8px;
            line-height: 1.2;
        }
        .site-header h1 span:nth-child(1) { color: #4285f4; }
        .site-header h1 span:nth-child(2) { color: #ea4335; }
        /* 「二创集」用 Google 四色渐变字 */
        .site-header h1::after {
            content: '二创集';
            position: absolute;
            right: -50px; bottom: 7px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #4285f4, #ea4335 34%, #fbbc04 67%, #34a853);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* 标题下的 Google 四色圆点 */
        .gdots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
        .gdots i { width: 8px; height: 8px; border-radius: 50%; }
        .gdots i:nth-child(1) { background: #4285f4; }
        .gdots i:nth-child(2) { background: #ea4335; }
        .gdots i:nth-child(3) { background: #fbbc04; }
        .gdots i:nth-child(4) { background: #34a853; }
        .site-sub { margin-top: 10px; font-size: 14px; letter-spacing: 2px; color: var(--text-2); }
        .site-count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding: 6px 16px;
            border-radius: 18px;
            font-size: 13px;
            color: var(--text-2);
            background: var(--surface-2);
            border: 1px solid var(--divider-2);
            pointer-events: none;
        }
        .site-count b { color: var(--blue); font-weight: 600; }

        /* ===== 工具条（Google Tabs 下划线选项卡） ===== */
        .toolbar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
            margin: 16px 0 22px;
            border-bottom: 1px solid var(--divider-2);
        }
        .chip {
            appearance: none;
            -webkit-appearance: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: -1px;
            padding: 12px 18px;
            border: none;
            border-bottom: 3px solid transparent;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-2);
            cursor: pointer;
            transition: color .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease);
        }
        .chip:hover { color: var(--text); background: var(--hover); }
        .chip.on { color: var(--blue-dark); border-bottom-color: var(--blue-dark); }
        .chip svg { width: 16px; height: 16px; flex: 0 0 auto; }
        .chip i { font-style: normal; font-size: 12px; font-weight: 400; opacity: .7; }

        /* ===== 网格：clamp 取代多档媒体查询 ===== */
        .grid {
            display: grid;
            grid-auto-flow: row dense;
            grid-template-columns: repeat(auto-fill, minmax(clamp(150px, 20vw, 265px), 1fr));
            gap: clamp(10px, 1.4vw, 20px);
            max-width: 1560px;
            margin: 0 auto;
        }

        /* ===== 媒体卡片 ===== */
        .media-card {
            position: relative;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--divider-2);
            border-radius: var(--radius);
            cursor: zoom-in;
            line-height: 0;
            transition: box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease);
            animation: cardIn .35s var(--ease) both;
        }
        .media-card:hover {
            transform: translateY(-2px);
            border-color: transparent;
            box-shadow: var(--shadow-2);
        }
        .media-card.video-card { cursor: pointer; }
        /* 横屏（宽幅）内容整行展示 */
        .media-card.span-row { grid-column: 1 / -1; }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        /* 媒体本体：卡片图片与视频封面共用尺寸规则 */
        .media-card img {
            display: block;
            width: auto; height: auto;
            max-width: 100%; max-height: 70vh;
            margin: 0 auto;
            background: var(--surface-2);
        }
        .media-card.span-row img { max-height: min(70vh, 760px); }
        @media (min-width: 1000px) {
            .media-card:not(.span-row) img { max-height: 62vh; }  /* 竖屏长图限高 */
        }

        /* 标题脚注（可选） */
        .card-caption {
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text-2);
            background: var(--surface);
            border-top: 1px solid var(--divider-2);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            user-select: none;
        }
        .media-card:hover .card-caption { color: var(--text); }

        /* 图 / 视频上的悬浮角标（Material 小标签） */
        .corner-hint {
            position: absolute;
            right: 8px; bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--text);
            background: rgba(255, 255, 255, .95);
            box-shadow: var(--shadow-1);
            opacity: 0;
            transition: opacity .2s var(--ease);
            pointer-events: none;
        }
        .media-card:hover .corner-hint { opacity: 1; }
        .corner-hint svg { width: 12px; height: 12px; }

        /* ===== 视频封面插槽 ===== */
        .poster-slot {
            position: relative;
            min-height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-2);
        }
        .poster-slot:not(.pending) { min-height: 0; }
        .poster-slot.posted { background: var(--surface-2); }
        .poster-slot .poster-img { opacity: 0; transition: opacity .5s var(--ease); }
        .poster-slot.posted .poster-img { opacity: 1; }

        .spinner {
            width: 26px; height: 26px;
            border-radius: 50%;
            border: 3px solid var(--divider);
            border-top-color: var(--blue);
            animation: spin .9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .poster-loading {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            font-size: 12px; line-height: 1.4;
            color: var(--text-3);
        }

        .poster-fallback {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            padding: 26px;
            color: var(--text-3); line-height: 1.4;
        }
        .poster-fallback svg { width: 36px; height: 36px; }
        .poster-fallback span { font-size: 13px; }

        /* 播放按钮（Material 半透明圆） */
        .play-badge {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: 52px; height: 52px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(32, 33, 36, .55);
            border: 1.5px solid rgba(255, 255, 255, .6);
            transition: background .2s var(--ease), transform .2s var(--ease);
            pointer-events: none;
        }
        .play-badge svg { width: 24px; height: 24px; fill: #fff; stroke: none; margin-left: 2px; }
        .media-card:hover .play-badge { background: var(--blue); transform: translate(-50%, -50%) scale(1.08); }

        /* ===== 状态 ===== */
        .loading, .empty-state, .error-msg { text-align: center; padding: 80px 16px; }
        .loading { font-size: 15px; color: var(--text-2); }
        .loading .hint { margin-top: 10px; font-size: 13px; color: var(--text-3); }
        .empty-state { color: var(--text-2); }
        .empty-state svg {
            width: 56px; height: 56px; margin-bottom: 16px;
            fill: none; stroke: var(--text-3); stroke-width: 1.5; stroke-linecap: round;
        }
        .empty-state p { font-size: 15px; }
        .error-msg { color: var(--red); }
        .error-msg .code { margin: 10px 0 18px; font-size: 13px; color: var(--text-3); word-break: break-all; }
        .btn-reload {
            height: 36px;
            padding: 0 24px;
            border-radius: 18px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--blue-dark);
            background: transparent;
            border: 1px solid var(--divider);
            cursor: pointer;
            transition: background .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
        }
        .btn-reload:hover { background: var(--blue-tint); border-color: transparent; box-shadow: var(--shadow-1); }
        .img-broken { opacity: .25; filter: grayscale(1); }

        /* ==========================================================
           详情查看器（图片大图 & 视频详情播放 通用）
           ========================================================== */
        .viewer {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--surface);
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s var(--ease), visibility .2s var(--ease);
        }
        .viewer.active { opacity: 1; visibility: visible; }
        .v-backdrop { position: absolute; inset: 0; cursor: zoom-out; }

        .v-stage {
            position: absolute;
            inset: 0 0 64px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 64px 24px 16px;
            background: var(--surface-2);
        }
        .v-stage img, .v-stage video {
            width: auto; height: auto;
            max-width: 100%; max-height: 100%;
            border-radius: 8px;
            outline: none;
            box-shadow: var(--shadow-2);
        }
        .v-stage img { object-fit: contain; background: var(--surface); animation: pop .25s var(--ease); cursor: zoom-out; }
        .v-stage video { background: #000; }
        @keyframes pop { from { transform: scale(.96); opacity: .5; } to { transform: scale(1); opacity: 1; } }

        .v-loading {
            position: absolute;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            font-size: 13px; color: var(--text-3);
        }
        .v-msg {
            max-width: 70%;
            font-size: 14px; line-height: 1.8;
            color: var(--text-2);
            text-align: center;
            word-break: break-all;
        }

        /* 关闭 / 方向键（Material 图标按钮） */
        .v-btn {
            position: absolute;
            z-index: 3;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: inherit;
            line-height: 1;
            color: var(--text-2);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background .2s var(--ease), color .2s var(--ease);
        }
        .v-btn:hover { background: var(--hover); color: var(--text); }
        .v-btn svg { width: 22px; height: 22px; }
        .v-close { top: 16px; right: 16px; }
        .v-nav { top: 50%; transform: translateY(-50%); }
        .v-prev { left: 12px; }
        .v-next { right: 12px; }

        /* 底部信息栏（Material 应用栏） */
        .v-bar {
            position: absolute;
            left: 0; bottom: 0;
            width: 100%;
            height: 64px;
            display: flex; align-items: center; gap: 12px;
            padding: 0 20px;
            background: var(--surface);
            border-top: 1px solid var(--divider-2);
        }
        .v-title {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .v-type, .v-counter { flex: 0 0 auto; font-size: 12px; }
        .v-type { padding: 3px 12px; border-radius: 16px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--divider-2); }
        .v-counter { color: var(--text-3); }
        .v-actions { flex: 0 0 auto; display: flex; gap: 4px; }
        .v-act {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 18px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--blue-dark);
            text-decoration: none;
            white-space: nowrap;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background .2s var(--ease);
        }
        .v-act:hover { background: var(--blue-tint); }
        .v-act svg { width: 16px; height: 16px; }
        .v-hint {
            position: absolute;
            left: 50%; bottom: 72px;
            transform: translateX(-50%);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: var(--text-3);
            background: var(--surface);
            border: 1px solid var(--divider-2);
            white-space: nowrap;
            pointer-events: none;
        }

        /* ===== 小屏适配 ===== */
        @media (max-width: 720px) {
            .v-stage { padding: 56px 8px 8px; }
            .v-stage video { width: 100%; }   /* 竖屏手机让视频占满宽度 */
        }
        @media (max-width: 640px) {
            body { padding: 16px 12px 56px; }
            .site-header h1 { font-size: 28px; letter-spacing: 6px; padding-right: 6px; }
            .site-header h1::after { right: -44px; bottom: 5px; font-size: 10px; letter-spacing: 1px; }
            .site-sub { font-size: 13px; }
            .site-count { margin-top: 10px; }
            .toolbar { margin: 18px 0 16px; }
            .corner-hint { display: none; }
            .v-close { top: 10px; right: 10px; width: 40px; height: 40px; }
            .v-nav { width: 40px; height: 40px; }
            .v-prev { left: 4px; }
            .v-next { right: 4px; }
            .v-hint { display: none; }
            .v-bar { gap: 8px; padding: 0 12px; }
            .v-title { font-size: 13px; }
            .v-act { padding: 7px 10px; }
        }
        @media (max-width: 400px) {
            .site-header h1::after { display: none; }
            .v-counter, .v-type { display: none; }
        }
        /* 横屏且较矮的设备（手机横过来 / 平板横屏） */
        @media (orientation: landscape) and (max-height: 560px) {
            body { padding-top: 10px; }
            .viewer .v-stage { inset: 0 0 52px 0; padding: 40px 8px 4px; }
            .v-hint { display: none; }
            .v-bar { height: 52px; }
            .site-count { display: none; }
        }

        /* 尊重「减少动态效果」系统设置 */
        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: .01ms !important; }
            .media-card, .v-stage img { animation: none; }
        }

        /* ===== 免责声明 ===== */
        .site-footer {
            max-width: 940px;
            margin: 48px auto 0;
            padding: 20px 16px 0;
            border-top: 1px solid var(--divider-2);
            text-align: center;
            font-size: 12px;
            line-height: 1.9;
            color: var(--text-3);
            user-select: none;
        }
        .site-footer a { color: var(--blue-dark); text-decoration: none; }
        /* 侵权申诉（Material 描边按钮） */
        .site-footer .appeal {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            height: 36px;
            padding: 0 20px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: .5px;
            color: var(--blue-dark);
            background: transparent;
            border: 1px solid var(--divider);
            transition: background .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
        }
        .site-footer .appeal:hover { background: var(--blue-tint); border-color: transparent; box-shadow: var(--shadow-1); }
        .site-footer .appeal svg { width: 16px; height: 16px; }

    </style>
</head>
<body>

    <!-- ===== 顶部 ===== -->
    <header class="site-header">
        <h1><span>昔</span><span>涟</span></h1>
        <span class="gdots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <p class="site-sub">图 片 · 视 频 二 创 集</p>
        <div class="site-count" id="siteCount"></div>
    </header>

    <!-- ===== 分类工具条 ===== -->
    <div class="toolbar" id="toolbar" hidden>
        <button class="chip on" data-filter="all">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="7.6" height="7.6" rx="1.6"/><rect x="13.2" y="3.2" width="7.6" height="7.6" rx="1.6"/><rect x="3.2" y="13.2" width="7.6" height="7.6" rx="1.6"/><rect x="13.2" y="13.2" width="7.6" height="7.6" rx="1.6"/></svg>
            全部 <i id="cAll"></i>
        </button>
        <button class="chip" data-filter="image">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.6" cy="9.4" r="1.7"/><path d="M21 15.6l-5-5-5.2 5.2-3.4-3.4L3 16.4"/></svg>
            图片 <i id="cImg"></i>
        </button>
        <button class="chip" data-filter="video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.6" y="5.6" width="13" height="12.8" rx="2.6"/><path d="M15.6 10.4l5.8-3.2v9.6l-5.8-3.2z"/></svg>
            视频 <i id="cVid"></i>
        </button>
    </div>

    <!-- ===== 内容 ===== -->
    <main id="app">
        <div class="loading" id="loadingState">
            <div class="spinner" style="margin:0 auto 16px;"></div>
            <div>加载中 · 请稍候</div>
            <div class="hint">正在读取 er.json</div>
        </div>
    </main>

    <!-- ===== 免责声明 ===== -->
    <footer class="site-footer">
        <p>本网页的所有视频和图片内容均由互联网提供，因部分原因，无法寻找到各个作品的对应作者，但由于org.cn的性质，此网站没有任何收费内容以及能让站长盈利的各种内容。</p>
        <a class="appeal" href="https://xilian.org.cn/aboutme" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3.5v5.3c0 4.1-3 7-7 7.9-4-.9-7-3.8-7-7.9V6.5z"/><path d="M12 8.2v4.2M12 15.3h.01"/></svg>
            侵权申诉
        </a>
    </footer>

    <!-- ===== 详情查看器 ===== -->
    <div class="viewer" id="viewer" role="dialog" aria-modal="true">
        <div class="v-backdrop"></div>

        <button class="v-btn v-close" id="vClose" aria-label="关闭">
            <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <button class="v-btn v-nav v-prev" id="vPrev" aria-label="上一个">
            <svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg>
        </button>
        <button class="v-btn v-nav v-next" id="vNext" aria-label="下一个">
            <svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>
        </button>

        <div class="v-stage" id="vStage"></div>

        <div class="v-hint">方向键 切换 · Esc 关闭 · 看视频点右下角“全屏”可横屏放大</div>

        <div class="v-bar">
            <div class="v-type" id="vType">视频</div>
            <div class="v-title" id="vTitle"></div>
            <div class="v-counter" id="vCounter"></div>
            <div class="v-actions">
                <button class="v-act" id="vFs" hidden>
                    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                    <span>全屏</span>
                </button>
                <a class="v-act" id="vLink" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
                    源文件
                </a>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // ---------- DOM ----------
        var APP = document.getElementById('app');
        var toolbar = document.getElementById('toolbar');
        var viewer = document.getElementById('viewer');
        var vStage = document.getElementById('vStage');
        var vType = document.getElementById('vType');
        var vTitle = document.getElementById('vTitle');
        var vCounter = document.getElementById('vCounter');
        var vFs = document.getElementById('vFs');
        var vLink = document.getElementById('vLink');

        var state = {
            all: [],        // 全部原始条目
            view: [],       // 当前筛选后展示的条目
            filter: 'all',
            cur: -1,
            open: false
        };

        var IMAGE_EXT = ['png','jpg','jpeg','webp','gif','bmp','svg','avif','tiff','tif','heic','heif'];
        var VIDEO_EXT = ['mp4','webm','mov','m4v','mkv','avi','flv','wmv','mpg','mpeg','3gp','ogv','ts'];

        // ---------- 工具 ----------
        function extOf(url) {
            return (url.split('?')[0].split('#')[0].match(/\.([a-z0-9]+)$/i) || [])[1] ?
                (url.split('?')[0].split('#')[0].match(/\.([a-z0-9]+)$/i) || [])[1].toLowerCase() : '';
        }
        function typeOf(url) {
            var e = extOf(url);
            if (VIDEO_EXT.indexOf(e) !== -1) return 'video';
            if (IMAGE_EXT.indexOf(e) !== -1) return 'image';
            return 'image'; // 未知后缀默认当图片
        }
        function escapeHtml(s) {
            if (s === undefined || s === null) return '';
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function urlName(u) {
            try {
                var s = u.split(/[?#]/)[0];
                var n = decodeURIComponent(s.split('/').pop() || '');
                return n || '';
            } catch (e) { return ''; }
        }

        // ---------- 数据解析（兼容多种 er.json 写法） ----------
        function normalizeItem(it) {
            if (typeof it === 'string') {
                return { url: it, type: typeOf(it), title: '', poster: '' };
            }
            if (it && typeof it === 'object') {
                var url = it.url || it.src || it.file || '';
                if (!/^https?:|^blob:|^\//.test(url) && !/^\.\.?\//.test(url)) {
                    // 保留相对路径判断：允许相对路径
                    if (!/\./.test(url.split('/').pop() || '')) return null;
                }
                if (!url) return null;
                return {
                    url: url,
                    type: (it.type === 'video' || it.type === 'image') ? it.type : typeOf(url),
                    title: it.title || '',
                    poster: it.poster || '',
                    w: it.w || 0,
                    h: it.h || 0
                };
            }
            return null;
        }

        function parseData(data) {
            var list = [];
            var pushArr = function (arr) {
                (arr || []).forEach(function (it) {
                    var item = normalizeItem(it);
                    if (item) list.push(item);
                });
            };
            if (Array.isArray(data)) {
                pushArr(data);
            } else if (data && typeof data === 'object') {
                if (Array.isArray(data.items)) pushArr(data.items);
                else if (Array.isArray(data.list)) pushArr(data.list);
                else if (Array.isArray(data.data)) pushArr(data.data);
                else {
                    // { key: url } 形式
                    Object.keys(data).forEach(function (k) {
                        var it = normalizeItem(data[k]);
                        if (it) { if (!it.title) it.title = k; list.push(it); }
                    });
                }
            }
            return list;
        }

        // ============================================================
        //  视频封面：截取第一帧（可看帧）生成缩略图
        // ============================================================
        var posterCache = {};   // url -> dataURL / null（本次会话内复用）
        var captureQueue = [];
        var activeCaptures = 0;
        var MAX_CONCURRENT = 2;

        function capturePoster(url, timeout) {
            timeout = timeout || 9000;
            return new Promise(function (resolve) {
                if (Object.prototype.hasOwnProperty.call(posterCache, url)) {
                    resolve(posterCache[url]); return;
                }
                var v = document.createElement('video');
                v.muted = true;
                v.playsInline = true;
                v.preload = 'metadata';
                if (/^https?:/i.test(url)) { try { v.crossOrigin = 'anonymous'; } catch (e) {} }

                var settled = false;
                var grabbed = false;
                var timer = null;
                var fallbackTimer = null;

                function finish(val) {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    clearTimeout(fallbackTimer);
                    try { v.removeAttribute('src'); v.load(); } catch (e) {}
                    posterCache[url] = val;
                    resolve(val);
                }
                function ok()   { finish(dataURL()); }
                function fail() { finish(null); }

                function dataURL() {
                    try {
                        var vw = v.videoWidth, vh = v.videoHeight;
                        if (!vw || !vh) return null;
                        var MAXW = 1280;
                        var scale = Math.min(1, MAXW / vw);
                        var w = Math.max(2, Math.round(vw * scale));
                        var h = Math.max(2, Math.round(vh * scale));
                        var c = document.createElement('canvas');
                        c.width = w; c.height = h;
                        var ctx = c.getContext('2d');
                        ctx.drawImage(v, 0, 0, w, h);
                        return c.toDataURL('image/jpeg', 0.85);
                    } catch (e) {
                        return null; // 跨域限制 / 无法读取帧
                    }
                }

                function grabNow() {
                    if (grabbed || settled) return;
                    var d = dataURL();
                    if (d) { grabbed = true; finish(d); }
                }

                v.onerror = function () { fail(); };
                v.onloadedmetadata = function () {
                    try {
                        var dur = v.duration;
                        var t = 0.05;
                        if (Number.isFinite(dur) && dur > 1) t = Math.min(1, dur * 0.12);
                        if (t >= dur) t = Math.max(0, dur - 0.05);
                        v.currentTime = t;
                    } catch (e) { fail(); }
                    // 若服务器不支持 seek，2 秒后尝试取当前已解码帧兜底
                    fallbackTimer = setTimeout(grabNow, 2200);
                };
                v.onseeked = function () { grabNow(); };
                v.onloadeddata = function () {
                    // seek 未成功时，帧可能已可解码，先不立刻取（避免黑帧），
                    // 交给 fallbackTimer 或 seeked。此处仅当 currentTime>0 才取。
                    if (v.currentTime > 0) grabNow();
                };

                timer = setTimeout(fail, timeout);
                v.src = url;
            });
        }

        function pumpCaptures() {
            while (activeCaptures < MAX_CONCURRENT && captureQueue.length) {
                var job = captureQueue.shift();
                activeCaptures++;
                capturePoster(job.url).then(function (data) {
                    job.slot && applyPoster(job.slot, data);
                }).catch(function () {
                    job.slot && applyPoster(job.slot, null);
                }).then(function () {
                    activeCaptures--;
                    pumpCaptures();
                });
            }
        }
        function enqueueCapture(slot) {
            captureQueue.push({ slot: slot, url: slot.getAttribute('data-url') });
            pumpCaptures();
        }

        // ============================================================
        //  渲染
        // ============================================================
        var io = null;
        if ('IntersectionObserver' in window) {
            io = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) {
                    if (!en.isIntersecting) return;
                    var slot = en.target;
                    io.unobserve(slot);
                    var url = slot.getAttribute('data-url');
                    if (Object.prototype.hasOwnProperty.call(posterCache, url)) {
                        applyPoster(slot, posterCache[url]);
                    } else {
                        enqueueCapture(slot);
                    }
                });
            }, { rootMargin: '600px 0px' });
        }

        function applyPoster(slot, data) {
            if (!slot) return;
            var img = slot.querySelector('.poster-img');
            var load = slot.querySelector('.poster-loading');
            var fb = slot.querySelector('.poster-fallback');
            if (load) load.style.display = 'none';
            slot.classList.remove('pending');
            if (data) {
                img.src = data;
                slot.classList.add('posted');
                img.addEventListener('load', function () { applyNatural(img, slot); });
                if (img.complete && img.naturalWidth) applyNatural(img, slot);
            } else {
                if (fb) fb.hidden = false;
            }
        }

        // 依据媒体真实比例决定是否整行放大展示（横屏内容）
        function applyNatural(el, slot) {
            var w = el.naturalWidth, h = el.naturalHeight;
            if (!w || !h) return;
            var card = slot ? slot.closest('.media-card') : el.closest('.media-card');
            if (!card) return;
            var ratio = w / h;
            card.setAttribute('data-ratio', ratio.toFixed(3));
            var isVideo = card.classList.contains('video-card');
            var span = ratio >= 1.55 && (isVideo || w >= 1000);
            card.classList.toggle('span-row', span);
        }

        function render() {
            var list = state.all.filter(function (it) {
                if (state.filter === 'all') return true;
                return it.type === state.filter;
            });
            state.view = list;

            var html = '<div class="grid">';

            list.forEach(function (it, idx) {
                var safeUrl = escapeHtml(it.url);
                var title = it.title ? '<div class="card-caption">' + escapeHtml(it.title) + '</div>' : '';

                if (it.type === 'video') {
                    html +=
                        '<div class="media-card video-card" data-index="' + idx + '" role="button" tabindex="0" aria-label="播放视频">' +
                            '<div class="poster-slot pending" data-url="' + safeUrl + '">' +
                                '<div class="poster-loading"><div class="spinner"></div><span>提取首帧…</span></div>' +
                                '<img class="poster-img" alt="" draggable="false" />' +
                                '<div class="poster-fallback" hidden>' +
                                    '<svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>' +
                                    '<span>点击播放视频</span>' +
                                '</div>' +
                                '<span class="play-badge"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span>' +
                                '<span class="corner-hint"><svg viewBox="0 0 24 24"><path d="M8.4 5.8v12.4L18.8 12z"/></svg>点击播放</span>' +
                            '</div>' + title +
                        '</div>';
                } else {
                    html +=
                        '<div class="media-card image-card" data-index="' + idx + '" role="button" tabindex="0" aria-label="查看大图">' +
                            '<img class="photo" src="' + safeUrl + '" alt="昔涟 · 二创" loading="lazy" draggable="false" ' +
                                'onerror="this.classList.add(\'img-broken\')" />' +
                            '<span class="corner-hint"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>查看大图</span>' + title +
                        '</div>';
                }
            });

            html += '</div>';
            APP.innerHTML = html;

            // 已入视口才去截取封面，节省流量
            var pending = APP.querySelectorAll('.poster-slot.pending');
            if (pending.length) {
                if (io) {
                    io.disconnect(); // 清掉旧页面残留的观察
                    pending.forEach(function (slot) { io.observe(slot); });
                } else {
                    pending.forEach(function (slot) { enqueueCapture(slot); });
                }
            }

            // 图片：等加载完拿到真实比例，决定横屏内容是否整行放大
            APP.querySelectorAll('img.photo').forEach(function (img) {
                if (img.complete && img.naturalWidth) applyNatural(img, null);
                else img.addEventListener('load', function () { applyNatural(img, null); });
            });

            // 进度类动画延迟
            APP.querySelectorAll('.media-card').forEach(function (card, i) {
                card.style.animationDelay = Math.min(i * 0.02, 0.5) + 's';
            });
        }

        // ============================================================
        //  详情查看器（图片大图 / 视频播放，混合浏览）
        // ============================================================
        function hideLoading() {
            var ld = vStage.querySelector('.v-loading');
            if (ld) ld.remove();
        }

        function stageMessage(msg) {
            var old = vStage.querySelector('.v-msg');
            if (old) old.remove();
            var div = document.createElement('div');
            div.className = 'v-msg';
            div.textContent = msg;
            vStage.appendChild(div);
        }

        function buildStage() {
            vStage.innerHTML = '';
            var item = state.view[state.cur];
            if (!item) return;

            // 加载指示
            var ld = document.createElement('div');
            ld.className = 'v-loading';
            ld.innerHTML = '<div class="spinner"></div><span>加载中…</span>';
            vStage.appendChild(ld);

            var isVid = item.type === 'video';

            if (isVid) {
                var video = document.createElement('video');
                video.src = item.url;
                video.controls = true;
                video.playsInline = true;
                video.preload = 'auto';
                video.setAttribute('playsinline', '');
                video.addEventListener('loadedmetadata', function () { hideLoading(); });
                video.addEventListener('error', function () { hideLoading(); stageMessage('视频无法播放：可能已失效、格式不支持或网络错误'); });
                video.play().catch(function () { /* 无用户手势时交给用户点播放 */ });
                vStage.appendChild(video);
                vFs.hidden = false;
            } else {
                var img = document.createElement('img');
                img.src = item.url;
                img.alt = item.title || '昔涟 · 二创';
                img.draggable = false;
                img.addEventListener('load', function () { hideLoading(); });
                img.addEventListener('error', function () { hideLoading(); stageMessage('图片加载失败：可能已失效或网络错误'); });
                vStage.appendChild(img);
                vFs.hidden = true;
            }

            // 信息栏
            var name = item.title || urlName(item.url) || item.url;
            vTitle.textContent = name;
            vType.textContent = isVid ? '视频' : '图片';
            vCounter.textContent = (state.cur + 1) + ' / ' + state.view.length;
            vLink.href = item.url;
            vFs.hidden = !isVid;

            // 单条时不显示切换按钮
            document.getElementById('vPrev').style.visibility = state.view.length > 1 ? 'visible' : 'hidden';
            document.getElementById('vNext').style.visibility = state.view.length > 1 ? 'visible' : 'hidden';
        }

        function openViewer(idx) {
            if (!state.view.length) return;
            var n = state.view.length;
            idx = ((idx % n) + n) % n;
            state.cur = idx;
            state.open = true;
            buildStage();
            viewer.classList.add('active');
            document.body.classList.add('no-scroll');
        }

        function closeViewer() {
            if (!state.open) return;
            state.open = false;
            vStage.innerHTML = '';      // 同时停掉视频
            viewer.classList.remove('active');
            document.body.classList.remove('no-scroll');
        }

        function navViewer(delta) {
            if (!state.open || state.view.length < 2) return;
            openViewer(state.cur + delta);
        }

        function fullscreenCurrent() {
            var video = vStage.querySelector('video');
            var doc = document;
            var fsEl = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement;
            if (fsEl) {
                var exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen;
                if (exit) exit.call(doc);
                return;
            }
            if (video) {
                if (video.webkitEnterFullscreen) { try { video.webkitEnterFullscreen(); return; } catch (e) {} }
                var vf = video.requestFullscreen || video.webkitRequestFullscreen;
                if (vf) { try { var p = vf.call(video); if (p && p.catch) p.catch(function(){}); } catch (e) {} return; }
            }
            var df = doc.documentElement.requestFullscreen || doc.documentElement.webkitRequestFullscreen;
            if (df) { try { df.call(doc.documentElement); } catch (e) {} }
        }

        // ---------- 事件绑定 ----------
        document.getElementById('vClose').addEventListener('click', closeViewer);
        document.getElementById('vPrev').addEventListener('click', function (e) { e.stopPropagation(); navViewer(-1); });
        document.getElementById('vNext').addEventListener('click', function (e) { e.stopPropagation(); navViewer(1); });
        vFs.addEventListener('click', function (e) { e.stopPropagation(); fullscreenCurrent(); });

        // 点空白区域关闭
        viewer.addEventListener('click', function (e) {
            if (e.target.closest('img, video, .v-bar, .v-btn, a, button')) return;
            closeViewer();
        });

        // 键盘：卡片回车/空格打开 + 查看器内 方向键 / Esc / F
        document.addEventListener('keydown', function (e) {
            var card = e.target && e.target.closest ? e.target.closest('.media-card') : null;
            if (card && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault();
                openViewer(Number(card.getAttribute('data-index')));
                return;
            }
            if (!state.open) return;
            if (e.key === 'Escape') { closeViewer(); return; }
            if (e.key === 'ArrowLeft') { navViewer(-1); return; }
            if (e.key === 'ArrowRight') { navViewer(1); return; }
            if (e.key === 'f' || e.key === 'F') { fullscreenCurrent(); return; }
        });

        // 触屏滑动：横滑切图，下滑关闭（在视频上不做，避免干扰进度条）
        var tsX = 0, tsY = 0;
        viewer.addEventListener('touchstart', function (e) {
            tsX = e.touches[0].clientX;
            tsY = e.touches[0].clientY;
        }, { passive: true });
        viewer.addEventListener('touchend', function (e) {
            if (!state.open) return;
            var dx = e.changedTouches[0].clientX - tsX;
            var dy = e.changedTouches[0].clientY - tsY;
            if (Math.abs(dx) < 40 && Math.abs(dy) < 40) return;
            if (e.target.closest && e.target.closest('video')) return; // 避开视频控制
            if (Math.abs(dy) > Math.abs(dx) && dy > 70) { closeViewer(); return; }
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
                navViewer(dx < 0 ? 1 : -1);
            }
        }, { passive: true });

        // 点卡片打开详情
        APP.addEventListener('click', function (e) {
            var card = e.target.closest ? e.target.closest('.media-card') : null;
            if (!card) return;
            openViewer(Number(card.getAttribute('data-index')));
        });

        // 分类筛选
        toolbar.addEventListener('click', function (e) {
            var chip = e.target.closest ? e.target.closest('.chip') : null;
            if (!chip) return;
            state.filter = chip.getAttribute('data-filter');
            toolbar.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c === chip); });
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ============================================================
        //  加载 er.json
        // ============================================================
        function loadData() {
            fetch('er.json', { cache: 'no-cache', headers: { 'Accept': 'application/json' } })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status + (res.statusText ? ' · ' + res.statusText : ''));
                    return res.json();
                })
                .then(function (data) {
                    var list = parseData(data);
                    if (!list.length) {
                        document.getElementById('loadingState') && (document.getElementById('loadingState').style.display = 'none');
                        toolbar.hidden = true;
                        APP.innerHTML =
                            '<div class="empty-state">' +
                                '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-5 5-5-5-3 3"/></svg>' +
                                '<p>还没有内容 · 去 er.json 添加链接吧</p>' +
                            '</div>';
                        return;
                    }
                    state.all = list;

                    // 顶部统计
                    var imgN = list.filter(function (i) { return i.type === 'image'; }).length;
                    var vidN = list.filter(function (i) { return i.type === 'video'; }).length;
                    document.getElementById('siteCount').innerHTML =
                        '共 <b>' + list.length + '</b> 个作品 · 图片 <b>' + imgN + '</b> · 视频 <b>' + vidN + '</b>';
                    document.getElementById('cAll').textContent = list.length;
                    document.getElementById('cImg').textContent = imgN;
                    document.getElementById('cVid').textContent = vidN;
                    toolbar.hidden = false;

                    render();
                })
                .catch(function (err) {
                    toolbar.hidden = true;
                    APP.innerHTML =
                        '<div class="error-msg">' +
                            '<p style="font-size:15px;letter-spacing:2px;">加载 er.json 失败</p>' +
                            '<div class="code">' + escapeHtml(err && err.message ? err.message : '请检查文件是否存在或网络连接') + '</div>' +
                            '<button class="btn-reload" id="btnReload">重新加载</button>' +
                            '<div style="margin-top:14px;font-size:12px;color:#4a3a5a;">确保 er.json 与 index.html 在同一目录，并通过 http/https 访问</div>' +
                        '</div>';
                    console.error('[昔涟] 加载失败:', err);
                    var btn = document.getElementById('btnReload');
                    if (btn) btn.addEventListener('click', loadData);
                });
        }

        loadData();
    })();
    </script>
</body>
</html>
